<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardianes del Pulque — Calendario de Actividades</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1a0a10;
            --bg-card: #241018;
            --bg-card-alt: #2e1520;
            --guinda: #691c32;
            --guinda-light: #8c2848;
            --guinda-glow: rgba(105, 28, 50, 0.35);
            --green: #10b981;
            --teal: #14b8a6;
            --amber: #f59e0b;
            --blue: #3b82f6;
            --red: #ef4444;
            --purple: #8b5cf6;
            --pink: #ec4899;
            --text: #f0e6ea;
            --text-dim: #9a8790;
            --border: rgba(255,255,255,0.07);
            --radius: 14px;
            --today: #691c32;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 999;
        }

        /* === HEADER === */
        .header {
            padding: 1.5rem 2.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--guinda-light), transparent);
            opacity: 0.5;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--guinda), #3d1020);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .logo-text h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
        }

        .logo-text span {
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .header-right {
            display: flex;
            gap: 0.6rem;
        }

        .btn {
            padding: 0.5rem 1.2rem;
            border-radius: 100px;
            border: none;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn--primary {
            background: var(--guinda);
            color: #fff;
        }

        .btn--primary:hover {
            background: var(--guinda-light);
        }

        .btn--ghost {
            background: rgba(255,255,255,0.05);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn--ghost:hover {
            background: rgba(255,255,255,0.1);
        }

        /* === MAIN LAYOUT === */
        .main {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 0;
            min-height: calc(100vh - 70px);
        }

        /* === CALENDAR SECTION === */
        .calendar-section {
            padding: 2rem 2.5rem;
        }

        .cal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
        }

        .cal-nav {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .cal-nav__month {
            font-family: 'Outfit', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            min-width: 220px;
            text-align: center;
        }

        .cal-nav__btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text);
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .cal-nav__btn:hover {
            background: var(--guinda);
            border-color: var(--guinda);
        }

        .cal-filters {
            display: flex;
            gap: 0.5rem;
        }

        .filter-tag {
            padding: 0.35rem 0.8rem;
            border-radius: 100px;
            font-size: 0.68rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-dim);
        }

        .filter-tag:hover, .filter-tag.active {
            border-color: transparent;
        }

        .filter-tag[data-cat="taller"] { --fc: var(--teal); }
        .filter-tag[data-cat="evento"] { --fc: var(--amber); }
        .filter-tag[data-cat="reunion"] { --fc: var(--blue); }
        .filter-tag[data-cat="cultivo"] { --fc: var(--green); }
        .filter-tag[data-cat="defensa"] { --fc: var(--red); }
        .filter-tag[data-cat="all"] { --fc: var(--guinda-light); }

        .filter-tag:hover, .filter-tag.active {
            background: var(--fc);
            color: #fff;
            border-color: var(--fc);
        }

        /* === CALENDAR GRID === */
        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background: var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .cal-day-name {
            padding: 0.8rem;
            text-align: center;
            font-size: 0.68rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-dim);
            background: var(--bg-card-alt);
        }

        .cal-cell {
            background: var(--bg-card);
            min-height: 100px;
            padding: 0.5rem;
            position: relative;
            transition: background 0.2s;
            cursor: pointer;
        }

        .cal-cell:hover {
            background: var(--bg-card-alt);
        }

        .cal-cell--other {
            opacity: 0.3;
        }

        .cal-cell--today {
            background: rgba(105, 28, 50, 0.2);
        }

        .cal-cell--today .cal-date {
            background: var(--guinda);
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cal-date {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-dim);
            margin-bottom: 0.3rem;
        }

        .cal-event {
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-size: 0.62rem;
            font-weight: 600;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.15s;
        }

        .cal-event:hover {
            transform: scale(1.03);
            opacity: 0.9;
        }

        .cal-event--taller { background: rgba(20,184,166,0.2); color: var(--teal); border-left: 2px solid var(--teal); }
        .cal-event--evento { background: rgba(245,158,11,0.2); color: var(--amber); border-left: 2px solid var(--amber); }
        .cal-event--reunion { background: rgba(59,130,246,0.2); color: var(--blue); border-left: 2px solid var(--blue); }
        .cal-event--cultivo { background: rgba(16,185,129,0.2); color: var(--green); border-left: 2px solid var(--green); }
        .cal-event--defensa { background: rgba(239,68,68,0.2); color: var(--red); border-left: 2px solid var(--red); }

        /* === SIDEBAR === */
        .sidebar {
            background: var(--bg-card);
            border-left: 1px solid var(--border);
            padding: 2rem 1.5rem;
            overflow-y: auto;
        }

        .sidebar__title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.3rem;
        }

        .sidebar__subtitle {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-bottom: 1.5rem;
        }

        .event-card {
            background: var(--bg-card-alt);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .event-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
        }

        .event-card--taller::before { background: var(--teal); }
        .event-card--evento::before { background: var(--amber); }
        .event-card--reunion::before { background: var(--blue); }
        .event-card--cultivo::before { background: var(--green); }
        .event-card--defensa::before { background: var(--red); }

        .event-card:hover {
            border-color: rgba(255,255,255,0.12);
            transform: translateX(-2px);
        }

        .event-card__date {
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.4rem;
        }

        .event-card--taller .event-card__date { color: var(--teal); }
        .event-card--evento .event-card__date { color: var(--amber); }
        .event-card--reunion .event-card__date { color: var(--blue); }
        .event-card--cultivo .event-card__date { color: var(--green); }
        .event-card--defensa .event-card__date { color: var(--red); }

        .event-card__title {
            font-weight: 600;
            font-size: 0.85rem;
            color: #ffffff;
            margin-bottom: 0.2rem;
        }

        .event-card__desc {
            font-size: 0.72rem;
            color: var(--text-dim);
            line-height: 1.4;
        }

        .event-card__lugar {
            font-size: 0.7rem;
            color: var(--text-dim);
            margin-top: 0.3rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .event-card__tag {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 100px;
            font-size: 0.58rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 0.5rem;
        }

        .event-card--taller .event-card__tag { background: rgba(20,184,166,0.15); color: var(--teal); }
        .event-card--evento .event-card__tag { background: rgba(245,158,11,0.15); color: var(--amber); }
        .event-card--reunion .event-card__tag { background: rgba(59,130,246,0.15); color: var(--blue); }
        .event-card--cultivo .event-card__tag { background: rgba(16,185,129,0.15); color: var(--green); }
        .event-card--defensa .event-card__tag { background: rgba(239,68,68,0.15); color: var(--red); }

        .no-events {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--text-dim);
            font-size: 0.8rem;
        }

        /* === ANIMATIONS === */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-in {
            animation: fadeUp 0.5s ease forwards;
            opacity: 0;
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }

        /* === RESPONSIVE === */
        @media (max-width: 900px) {
            .main {
                grid-template-columns: 1fr;
            }
            .sidebar {
                border-left: none;
                border-top: 1px solid var(--border);
            }
            .calendar-section { padding: 1.5rem 1rem; }
            .cal-cell { min-height: 70px; }
            .cal-event { font-size: 0.55rem; }
            .header { padding: 1rem; flex-wrap: wrap; gap: 0.8rem; }
            .cal-header { flex-direction: column; gap: 1rem; }
        }

        @media (max-width: 500px) {
            .cal-cell { min-height: 55px; padding: 0.3rem; }
            .cal-date { font-size: 0.7rem; }
            .cal-event { display: none; }
            .cal-cell--has-event::after {
                content: '';
                display: block;
                width: 5px;
                height: 5px;
                border-radius: 50%;
                background: var(--guinda-light);
                margin: 0.2rem auto 0;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="logo-area">
            <div class="logo-icon">🌵</div>
            <div class="logo-text">
                <h1>Guardianes del Pulque</h1>
                <span>Calendario de Actividades</span>
            </div>
        </div>
        <div class="header-right">
            <button class="btn btn--ghost" onclick="goToday()">Hoy</button>
        </div>
    </header>

    <!-- MAIN -->
    <div class="main">

        <!-- CALENDAR -->
        <div class="calendar-section animate-in">
            <div class="cal-header">
                <div class="cal-nav">
                    <button class="cal-nav__btn" onclick="changeMonth(-1)">◀</button>
                    <div class="cal-nav__month" id="monthLabel"></div>
                    <button class="cal-nav__btn" onclick="changeMonth(1)">▶</button>
                </div>
                <div class="cal-filters">
                    <button class="filter-tag active" data-cat="all" onclick="filterCat('all', this)">Todos</button>
                    <button class="filter-tag" data-cat="taller" onclick="filterCat('taller', this)">Talleres</button>
                    <button class="filter-tag" data-cat="evento" onclick="filterCat('evento', this)">Eventos</button>
                    <button class="filter-tag" data-cat="cultivo" onclick="filterCat('cultivo', this)">Cultivo</button>
                    <button class="filter-tag" data-cat="reunion" onclick="filterCat('reunion', this)">Reuniones</button>
                    <button class="filter-tag" data-cat="defensa" onclick="filterCat('defensa', this)">Defensa</button>
                </div>
            </div>
            <div class="cal-grid" id="calGrid"></div>
        </div>

        <!-- SIDEBAR -->
        <div class="sidebar animate-in delay-1">
            <h2 class="sidebar__title" id="sidebarTitle">Próximas actividades</h2>
            <p class="sidebar__subtitle" id="sidebarSubtitle">Agenda del mes</p>
            <div id="eventList"></div>
        </div>
    </div>

    <script>
        const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
        const DAYS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
        const CAT_LABELS = { taller:'Taller', evento:'Evento', cultivo:'Cultivo', reunion:'Reunión', defensa:'Defensa' };

        let currentDate = new Date();
        let currentMonth = currentDate.getMonth();
        let currentYear = currentDate.getFullYear();
        let activeFilter = 'all';

        // ==========================================
        // EVENTOS — Agrega tus actividades aquí
        // ==========================================
        const events = [
            { title: 'Taller de composta orgánica', date: '2026-03-15', time: '10:00', cat: 'taller', desc: 'Aprende a hacer composta con materiales locales' },
            { title: '2da Feria del Maíz Milpa, Saberes y Cultura 2026', date: '2026-03-21', cat: 'evento', desc: 'Feria comunitaria en torno al maíz nativo, milpa y saberes tradicionales', lugar: 'San Juan Yutepec' },
            // Para agregar más eventos, copia esta línea y cambia los datos:
            // { title: 'Nombre', date: '2026-MM-DD', cat: 'taller', desc: 'Descripción', lugar: 'Lugar (opcional)' },
            // Categorías: taller, evento, cultivo, reunion, defensa
        ];


        function renderCalendar() {
            const grid = document.getElementById('calGrid');
            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            const daysInPrev = new Date(currentYear, currentMonth, 0).getDate();
            const today = new Date();

            document.getElementById('monthLabel').textContent = `${MONTHS[currentMonth]} ${currentYear}`;

            let html = DAYS.map(d => `<div class="cal-day-name">${d}</div>`).join('');

            // Previous month
            for (let i = firstDay - 1; i >= 0; i--) {
                html += `<div class="cal-cell cal-cell--other"><div class="cal-date">${daysInPrev - i}</div></div>`;
            }

            // Current month
            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const isToday = (d === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear());
                const dayEvents = events.filter(e => e.date === dateStr && (activeFilter === 'all' || e.cat === activeFilter));
                const hasEvent = dayEvents.length > 0;

                html += `<div class="cal-cell ${isToday ? 'cal-cell--today' : ''} ${hasEvent ? 'cal-cell--has-event' : ''}" onclick="selectDate('${dateStr}')">`;
                html += `<div class="cal-date">${d}</div>`;
                dayEvents.forEach(ev => {
                    html += `<div class="cal-event cal-event--${ev.cat}" title="${ev.title}">${ev.title}</div>`;
                });
                html += `</div>`;
            }

            // Next month
            const totalCells = firstDay + daysInMonth;
            const remaining = (7 - (totalCells % 7)) % 7;
            for (let i = 1; i <= remaining; i++) {
                html += `<div class="cal-cell cal-cell--other"><div class="cal-date">${i}</div></div>`;
            }

            grid.innerHTML = html;
            renderSidebar();
        }

        function renderSidebar(dateStr) {
            const list = document.getElementById('eventList');
            const titleEl = document.getElementById('sidebarTitle');
            const subEl = document.getElementById('sidebarSubtitle');

            let filtered;
            if (dateStr) {
                filtered = events.filter(e => e.date === dateStr && (activeFilter === 'all' || e.cat === activeFilter));
                const d = new Date(dateStr + 'T12:00:00');
                titleEl.textContent = `${d.getDate()} de ${MONTHS[d.getMonth()]}`;
                subEl.textContent = filtered.length ? `${filtered.length} actividad(es)` : 'Sin actividades';
            } else {
                const monthStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}`;
                filtered = events.filter(e => e.date.startsWith(monthStr) && (activeFilter === 'all' || e.cat === activeFilter));
                filtered.sort((a,b) => a.date.localeCompare(b.date));
                titleEl.textContent = 'Próximas actividades';
                subEl.textContent = `${MONTHS[currentMonth]} ${currentYear}`;
            }

            if (!filtered.length) {
                list.innerHTML = '<div class="no-events">No hay actividades programadas</div>';
                return;
            }

            list.innerHTML = filtered.map(ev => {
                const d = new Date(ev.date + 'T12:00:00');
                return `
                    <div class="event-card event-card--${ev.cat}">
                        <div class="event-card__date">${d.getDate()} ${MONTHS[d.getMonth()]}${ev.time ? ' · ' + ev.time + 'h' : ''}</div>
                        <div class="event-card__title">${ev.title}</div>
                        <div class="event-card__desc">${ev.desc}</div>
                        ${ev.lugar ? `<div class="event-card__lugar">📍 ${ev.lugar}</div>` : ''}
                        <span class="event-card__tag">${CAT_LABELS[ev.cat]}</span>
                    </div>
                `;
            }).join('');
        }

        function changeMonth(dir) {
            currentMonth += dir;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar();
        }

        function goToday() {
            const today = new Date();
            currentMonth = today.getMonth();
            currentYear = today.getFullYear();
            renderCalendar();
        }

        function selectDate(dateStr) {
            renderSidebar(dateStr);
        }

        function filterCat(cat, el) {
            activeFilter = cat;
            document.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            renderCalendar();
        }

        renderCalendar();
    </script>

</body>
</html>
