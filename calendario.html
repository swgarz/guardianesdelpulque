<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardianes del Pulque — Calendario de Actividades</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #071a0f;
            --bg-card: #0c2318;
            --bg-card-alt: #112d1f;
            --guinda: #065f46;
            --guinda-light: #059669;
            --guinda-glow: rgba(5, 150, 105, 0.35);
            --green: #10b981;
            --teal: #14b8a6;
            --amber: #f59e0b;
            --blue: #3b82f6;
            --red: #ef4444;
            --purple: #8b5cf6;
            --pink: #ec4899;
            --text: #e6f4ee;
            --text-dim: #7aad92;
            --border: rgba(5,150,105,0.15);
            --radius: 14px;
            --today: #065f46;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 999;
        }

        /* === HEADER === */
        .header {
            padding: 1.5rem 2.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, #10b981, #6ee7b7, #10b981, transparent);
            opacity: 0.8;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-icon {
            display: flex;
            align-items: center;
        }

        .logo-text h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
        }

        .logo-text span {
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .header-right {
            display: flex;
            gap: 0.6rem;
        }

        .btn {
            padding: 0.5rem 1.2rem;
            border-radius: 100px;
            border: none;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn--primary {
            background: var(--guinda);
            color: #fff;
        }

        .btn--primary:hover {
            background: var(--guinda-light);
        }

        .btn--ghost {
            background: rgba(255,255,255,0.05);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn--ghost:hover {
            background: rgba(255,255,255,0.1);
        }

        /* === MAIN LAYOUT === */
        .main {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 0;
            min-height: calc(100vh - 70px);
        }

        /* === CALENDAR SECTION === */
        .calendar-section {
            padding: 2rem 2.5rem;
        }

        .cal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
        }

        .cal-nav {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .cal-nav__month {
            font-family: 'Outfit', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            min-width: 220px;
            text-align: center;
        }

        .cal-nav__btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text);
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .cal-nav__btn:hover {
            background: var(--guinda);
            border-color: var(--guinda);
        }

        .cal-filters {
            display: flex;
            gap: 0.5rem;
        }

        .filter-tag {
            padding: 0.35rem 0.8rem;
            border-radius: 100px;
            font-size: 0.68rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-dim);
        }

        .filter-tag:hover, .filter-tag.active {
            border-color: transparent;
        }

        .filter-tag[data-cat="taller"]    { --fc: var(--teal); }
        .filter-tag[data-cat="evento"]    { --fc: var(--amber); }
        .filter-tag[data-cat="reunion"]   { --fc: var(--blue); }
        .filter-tag[data-cat="cultivo"]   { --fc: var(--green); }
        .filter-tag[data-cat="defensa"]   { --fc: var(--red); }
        .filter-tag[data-cat="all"]       { --fc: var(--guinda-light); }
        .filter-tag[data-cat="fermentos"] { --fc: #c4b5fd; }

        .filter-subtag {
            font-size: 0.6rem;
            padding: 0.25rem 0.65rem;
            border-radius: 100px;
            border: 1px dashed rgba(196,181,253,0.45);
            background: transparent;
            color: #c4b5fd;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
            margin-left: -0.2rem;
        }
        .filter-subtag:hover, .filter-subtag.active {
            background: #c4b5fd;
            color: #1e1040;
            border-color: #c4b5fd;
            border-style: solid;
        }

        .filter-tag:hover, .filter-tag.active {
            background: var(--fc);
            color: #fff;
            border-color: var(--fc);
        }

        /* === CALENDAR GRID === */
        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background: var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .cal-day-name {
            padding: 0.8rem;
            text-align: center;
            font-size: 0.68rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-dim);
            background: var(--bg-card-alt);
        }

        .cal-cell {
            background: var(--bg-card);
            min-height: 100px;
            padding: 0.5rem;
            position: relative;
            transition: background 0.2s;
            cursor: pointer;
        }

        .cal-cell:hover {
            background: var(--bg-card-alt);
        }

        .cal-cell--other {
            opacity: 0.3;
        }

        .cal-cell--today {
            background: rgba(105, 28, 50, 0.2);
        }

        .cal-cell--today .cal-date {
            background: var(--guinda);
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cal-date {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-dim);
            margin-bottom: 0.3rem;
        }

        .cal-event {
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-size: 0.62rem;
            font-weight: 600;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.15s;
        }

        .cal-event:hover {
            transform: scale(1.03);
            opacity: 0.9;
        }

        .cal-event--taller  { background: rgba(20,184,166,0.2);  color: var(--teal);   border-left: 2px solid var(--teal); }
        .cal-event--evento  { background: rgba(245,158,11,0.2);  color: var(--amber);  border-left: 2px solid var(--amber); }
        .cal-event--reunion { background: rgba(59,130,246,0.2);  color: var(--blue);   border-left: 2px solid var(--blue); }
        .cal-event--cultivo { background: rgba(16,185,129,0.2);  color: var(--green);  border-left: 2px solid var(--green); }
        .cal-event--defensa { background: rgba(239,68,68,0.2);   color: var(--red);    border-left: 2px solid var(--red); }
        .cal-event--purple   { background: rgba(139,92,246,0.2);  color: var(--purple); border-left: 2px solid var(--purple); }
        .cal-event--pink     { background: rgba(236,72,153,0.2);  color: var(--pink);   border-left: 2px solid var(--pink); }
        .cal-event--fermentos{ background: rgba(196,181,253,0.2); color: #c4b5fd;       border-left: 2px solid #c4b5fd; }

        /* === SIDEBAR === */
        .sidebar {
            background: var(--bg-card);
            border-left: 1px solid var(--border);
            padding: 2rem 1.5rem;
            overflow-y: auto;
        }

        .sidebar__title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.3rem;
        }

        .sidebar__subtitle {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-bottom: 1.5rem;
        }

        .event-card {
            border-radius: 14px;
            padding: 1.1rem 1rem 1rem;
            margin-bottom: 0.8rem;
            cursor: pointer;
            transition: all 0.22s ease;
            position: relative;
            overflow: hidden;
            border-left-width: 4px;
            border-left-style: solid;
            border-top: 1px solid;
            border-right: 1px solid;
            border-bottom: 1px solid;
        }

        .event-card::after {
            content: '';
            position: absolute;
            top: -30px;
            right: -30px;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            pointer-events: none;
        }

        /* Taller — teal */
        .event-card--taller {
            background: linear-gradient(135deg, rgba(20,184,166,0.15) 0%, rgba(20,184,166,0.05) 100%);
            border-left-color: #14b8a6;
            border-top-color: rgba(20,184,166,0.25);
            border-right-color: rgba(20,184,166,0.25);
            border-bottom-color: rgba(20,184,166,0.25);
        }
        .event-card--taller::after { background: radial-gradient(circle, rgba(20,184,166,0.12) 0%, transparent 70%); }
        .event-card--taller:hover { background: linear-gradient(135deg, rgba(20,184,166,0.25) 0%, rgba(20,184,166,0.12) 100%); border-left-color: #14b8a6; border-top-color: rgba(20,184,166,0.5); border-right-color: rgba(20,184,166,0.5); border-bottom-color: rgba(20,184,166,0.5); box-shadow: 0 8px 24px rgba(20,184,166,0.2); }

        /* Evento — amber */
        .event-card--evento {
            background: linear-gradient(135deg, rgba(245,158,11,0.15) 0%, rgba(245,158,11,0.05) 100%);
            border-left-color: #f59e0b;
            border-top-color: rgba(245,158,11,0.25);
            border-right-color: rgba(245,158,11,0.25);
            border-bottom-color: rgba(245,158,11,0.25);
        }
        .event-card--evento::after { background: radial-gradient(circle, rgba(245,158,11,0.12) 0%, transparent 70%); }
        .event-card--evento:hover { background: linear-gradient(135deg, rgba(245,158,11,0.25) 0%, rgba(245,158,11,0.12) 100%); border-left-color: #f59e0b; border-top-color: rgba(245,158,11,0.5); border-right-color: rgba(245,158,11,0.5); border-bottom-color: rgba(245,158,11,0.5); box-shadow: 0 8px 24px rgba(245,158,11,0.2); }

        /* Reunión — blue */
        .event-card--reunion {
            background: linear-gradient(135deg, rgba(59,130,246,0.15) 0%, rgba(59,130,246,0.05) 100%);
            border-left-color: #3b82f6;
            border-top-color: rgba(59,130,246,0.25);
            border-right-color: rgba(59,130,246,0.25);
            border-bottom-color: rgba(59,130,246,0.25);
        }
        .event-card--reunion::after { background: radial-gradient(circle, rgba(59,130,246,0.12) 0%, transparent 70%); }
        .event-card--reunion:hover { background: linear-gradient(135deg, rgba(59,130,246,0.25) 0%, rgba(59,130,246,0.12) 100%); border-left-color: #3b82f6; border-top-color: rgba(59,130,246,0.5); border-right-color: rgba(59,130,246,0.5); border-bottom-color: rgba(59,130,246,0.5); box-shadow: 0 8px 24px rgba(59,130,246,0.2); }

        /* Cultivo — green */
        .event-card--cultivo {
            background: linear-gradient(135deg, rgba(16,185,129,0.15) 0%, rgba(16,185,129,0.05) 100%);
            border-left-color: #10b981;
            border-top-color: rgba(16,185,129,0.25);
            border-right-color: rgba(16,185,129,0.25);
            border-bottom-color: rgba(16,185,129,0.25);
        }
        .event-card--cultivo::after { background: radial-gradient(circle, rgba(16,185,129,0.12) 0%, transparent 70%); }
        .event-card--cultivo:hover { background: linear-gradient(135deg, rgba(16,185,129,0.25) 0%, rgba(16,185,129,0.12) 100%); border-left-color: #10b981; border-top-color: rgba(16,185,129,0.5); border-right-color: rgba(16,185,129,0.5); border-bottom-color: rgba(16,185,129,0.5); box-shadow: 0 8px 24px rgba(16,185,129,0.2); }

        /* Defensa — red */
        .event-card--defensa {
            background: linear-gradient(135deg, rgba(239,68,68,0.15) 0%, rgba(239,68,68,0.05) 100%);
            border-left-color: #ef4444;
            border-top-color: rgba(239,68,68,0.25);
            border-right-color: rgba(239,68,68,0.25);
            border-bottom-color: rgba(239,68,68,0.25);
        }
        .event-card--defensa::after { background: radial-gradient(circle, rgba(239,68,68,0.12) 0%, transparent 70%); }
        .event-card--defensa:hover { background: linear-gradient(135deg, rgba(239,68,68,0.25) 0%, rgba(239,68,68,0.12) 100%); border-left-color: #ef4444; border-top-color: rgba(239,68,68,0.5); border-right-color: rgba(239,68,68,0.5); border-bottom-color: rgba(239,68,68,0.5); box-shadow: 0 8px 24px rgba(239,68,68,0.2); }

        /* Fermentos — morado claro */
        .event-card--fermentos {
            background: linear-gradient(135deg, rgba(196,181,253,0.15) 0%, rgba(196,181,253,0.05) 100%);
            border-left-color: #c4b5fd;
            border-top-color: rgba(196,181,253,0.25);
            border-right-color: rgba(196,181,253,0.25);
            border-bottom-color: rgba(196,181,253,0.25);
        }
        .event-card--fermentos::after { background: radial-gradient(circle, rgba(196,181,253,0.12) 0%, transparent 70%); }
        .event-card--fermentos:hover { background: linear-gradient(135deg, rgba(196,181,253,0.25) 0%, rgba(196,181,253,0.12) 100%); border-left-color: #c4b5fd; border-top-color: rgba(196,181,253,0.5); border-right-color: rgba(196,181,253,0.5); border-bottom-color: rgba(196,181,253,0.5); box-shadow: 0 8px 24px rgba(196,181,253,0.2); }
        .event-card--fermentos .event-card__date { color: #c4b5fd; }
        .event-card--fermentos .event-card__tag { background: rgba(196,181,253,0.15); color: #c4b5fd; border: 1px solid rgba(196,181,253,0.35); }

        /* Purple */
        .event-card--purple {
            background: linear-gradient(135deg, rgba(139,92,246,0.15) 0%, rgba(139,92,246,0.05) 100%);
            border-left-color: #8b5cf6;
            border-top-color: rgba(139,92,246,0.25);
            border-right-color: rgba(139,92,246,0.25);
            border-bottom-color: rgba(139,92,246,0.25);
        }
        .event-card--purple::after { background: radial-gradient(circle, rgba(139,92,246,0.12) 0%, transparent 70%); }
        .event-card--purple:hover { background: linear-gradient(135deg, rgba(139,92,246,0.25) 0%, rgba(139,92,246,0.12) 100%); border-left-color: #8b5cf6; border-top-color: rgba(139,92,246,0.5); border-right-color: rgba(139,92,246,0.5); border-bottom-color: rgba(139,92,246,0.5); box-shadow: 0 8px 24px rgba(139,92,246,0.2); }
        .event-card--purple .event-card__date { color: #a78bfa; }
        .event-card--purple .event-card__tag { background: rgba(139,92,246,0.15); color: #a78bfa; border: 1px solid rgba(139,92,246,0.35); }

        /* Pink */
        .event-card--pink {
            background: linear-gradient(135deg, rgba(236,72,153,0.15) 0%, rgba(236,72,153,0.05) 100%);
            border-left-color: #ec4899;
            border-top-color: rgba(236,72,153,0.25);
            border-right-color: rgba(236,72,153,0.25);
            border-bottom-color: rgba(236,72,153,0.25);
        }
        .event-card--pink::after { background: radial-gradient(circle, rgba(236,72,153,0.12) 0%, transparent 70%); }
        .event-card--pink:hover { background: linear-gradient(135deg, rgba(236,72,153,0.25) 0%, rgba(236,72,153,0.12) 100%); border-left-color: #ec4899; border-top-color: rgba(236,72,153,0.5); border-right-color: rgba(236,72,153,0.5); border-bottom-color: rgba(236,72,153,0.5); box-shadow: 0 8px 24px rgba(236,72,153,0.2); }
        .event-card--pink .event-card__date { color: #f472b6; }
        .event-card--pink .event-card__tag { background: rgba(236,72,153,0.15); color: #f472b6; border: 1px solid rgba(236,72,153,0.35); }

        .event-card__date {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 0.45rem;
        }

        .event-card--taller .event-card__date { color: #14b8a6; }
        .event-card--evento .event-card__date { color: #f59e0b; }
        .event-card--reunion .event-card__date { color: #3b82f6; }
        .event-card--cultivo .event-card__date { color: #10b981; }
        .event-card--defensa .event-card__date { color: #ef4444; }

        .event-card__title {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            line-height: 1.25;
            background: linear-gradient(135deg, #ffffff 0%, #6ee7b7 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.2rem;
        }

        .event-card__desc {
            font-size: 0.72rem;
            color: var(--text-dim);
            line-height: 1.4;
        }

        .event-card__subtitle {
            font-size: 0.68rem;
            color: var(--text-dim);
            margin-top: 0.1rem;
            font-style: italic;
        }

        .event-card__lugar {
            font-size: 0.7rem;
            color: var(--text-dim);
            margin-top: 0.3rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .event-card__aportacion {
            font-size: 0.7rem;
            margin-top: 0.3rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-weight: 700;
            color: #6ee7b7;
        }

        .event-card__tag {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 100px;
            font-size: 0.58rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 0.5rem;
        }

        .event-card--taller .event-card__tag { background: rgba(20,184,166,0.15); color: #14b8a6; border: 1px solid rgba(20,184,166,0.35); }
        .event-card--evento .event-card__tag { background: rgba(245,158,11,0.15); color: #f59e0b; border: 1px solid rgba(245,158,11,0.35); }
        .event-card--reunion .event-card__tag { background: rgba(59,130,246,0.15); color: #3b82f6; border: 1px solid rgba(59,130,246,0.35); }
        .event-card--cultivo .event-card__tag { background: rgba(16,185,129,0.15); color: #10b981; border: 1px solid rgba(16,185,129,0.35); }
        .event-card--defensa .event-card__tag { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.35); }

        .no-events {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--text-dim);
            font-size: 0.8rem;
        }

        /* === ANIMATIONS === */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-in {
            animation: fadeUp 0.5s ease forwards;
            opacity: 0;
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }

        /* === RESPONSIVE === */
        @media (max-width: 900px) {
            .main {
                grid-template-columns: 1fr;
            }
            .sidebar {
                border-left: none;
                border-top: 1px solid var(--border);
            }
            .calendar-section { padding: 1.5rem 1rem; }
            .cal-cell { min-height: 70px; }
            .cal-event { font-size: 0.55rem; }
            .header { padding: 1rem; flex-wrap: wrap; gap: 0.8rem; }
            .cal-header { flex-direction: column; gap: 1rem; }
        }

        @media (max-width: 500px) {
            .cal-cell { min-height: 55px; padding: 0.3rem; }
            .cal-date { font-size: 0.7rem; }
            .cal-event { display: none; }
            .cal-cell--has-event::after {
                content: '';
                display: block;
                width: 5px;
                height: 5px;
                border-radius: 50%;
                background: var(--guinda-light);
                margin: 0.2rem auto 0;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="logo-area">
            <img src="images/logo_transparente.png" alt="Guardianes del Pulque" style="height:44px;width:auto;display:block;">
            <div class="logo-text">
                <h1>Guardianes del Pulque</h1>
                <span>Calendario de Actividades</span>
            </div>
        </div>
        <div class="header-right">
            <button class="btn btn--ghost" onclick="goToday()">Hoy</button>
        </div>
    </header>

    <!-- MAIN -->
    <div class="main">

        <!-- CALENDAR -->
        <div class="calendar-section animate-in">
            <div class="cal-header">
                <div class="cal-nav">
                    <button class="cal-nav__btn" onclick="changeMonth(-1)">◀</button>
                    <div class="cal-nav__month" id="monthLabel"></div>
                    <button class="cal-nav__btn" onclick="changeMonth(1)">▶</button>
                </div>
                <div class="cal-filters">
                    <button class="filter-tag active" data-cat="all" onclick="filterCat('all', this)">Todos</button>
                    <button class="filter-tag" data-cat="taller" onclick="filterCat('taller', this)">Talleres</button>
                    <button class="filter-tag" data-cat="evento" onclick="filterCat('evento', this)">Eventos</button>
                    <button class="filter-tag" data-cat="cultivo" onclick="filterCat('cultivo', this)">Cultivo</button>
                    <button class="filter-tag" data-cat="reunion" onclick="filterCat('reunion', this)">Reuniones</button>
                    <button class="filter-tag" data-cat="defensa" onclick="filterCat('defensa', this)">Defensa</button>
                </div>
            </div>
            <div class="cal-grid" id="calGrid"></div>
        </div>

        <!-- SIDEBAR -->
        <div class="sidebar animate-in delay-1">
            <h2 class="sidebar__title" id="sidebarTitle">Próximas actividades</h2>
            <p class="sidebar__subtitle" id="sidebarSubtitle">Agenda del mes</p>
            <div id="eventList"></div>
        </div>
    </div>

    <script>
        const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
        const DAYS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
        const CAT_LABELS = { taller:'Taller', evento:'Evento', cultivo:'Cultivo', reunion:'Reunión', defensa:'Defensa', fermentos:'Fermentos', alebrijes:'Alebrijes' };

        let currentDate = new Date();
        let currentMonth = currentDate.getMonth();
        let currentYear = currentDate.getFullYear();
        let activeFilter = 'all';

        // ==========================================
        // EVENTOS — Agrega tus actividades aquí
        // ==========================================
        const events = [
            { title: '2da Feria del Maíz Milpa, Saberes y Cultura 2026', date: '2026-03-21', time: '12:00', cat: 'evento', color: 'evento', desc: 'Feria comunitaria en torno al maíz nativo, milpa y saberes tradicionales', lugar: 'San Juan Yutepec' },
            { title: 'Taller de fermentos', subtitle: 'Col morada', date: '2026-03-22', time: '10:00', cat: 'taller', subtag: 'fermentos', color: 'fermentos', desc: '', lugar: 'Pulquería' },
            { title: 'Creación de Alebrijes', date: '2026-04-18', time: '10:00', cat: 'taller', subtag: 'alebrijes', color: 'pink', desc: '', aportacion: '$600' },
            // Para agregar más eventos, copia esta línea y cambia los datos:
            // { title: 'Nombre', date: '2026-MM-DD', cat: 'taller', desc: 'Descripción', lugar: 'Lugar (opcional)' },
            // Categorías: taller, evento, cultivo, reunion, defensa
        ];


        function renderCalendar() {
            const grid = document.getElementById('calGrid');
            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            const daysInPrev = new Date(currentYear, currentMonth, 0).getDate();
            const today = new Date();

            document.getElementById('monthLabel').textContent = `${MONTHS[currentMonth]} ${currentYear}`;

            let html = DAYS.map(d => `<div class="cal-day-name">${d}</div>`).join('');

            // Previous month
            for (let i = firstDay - 1; i >= 0; i--) {
                html += `<div class="cal-cell cal-cell--other"><div class="cal-date">${daysInPrev - i}</div></div>`;
            }

            // Current month
            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const isToday = (d === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear());
                const dayEvents = events.filter(e => e.date === dateStr && (activeFilter === 'all' || e.cat === activeFilter || e.subtag === activeFilter));
                const hasEvent = dayEvents.length > 0;

                html += `<div class="cal-cell ${isToday ? 'cal-cell--today' : ''} ${hasEvent ? 'cal-cell--has-event' : ''}" onclick="selectDate('${dateStr}')">`;
                html += `<div class="cal-date">${d}</div>`;
                dayEvents.forEach(ev => {
                    html += `<div class="cal-event cal-event--${ev.color || ev.cat}" title="${ev.title}">${ev.title}</div>`;
                });
                html += `</div>`;
            }

            // Next month
            const totalCells = firstDay + daysInMonth;
            const remaining = (7 - (totalCells % 7)) % 7;
            for (let i = 1; i <= remaining; i++) {
                html += `<div class="cal-cell cal-cell--other"><div class="cal-date">${i}</div></div>`;
            }

            grid.innerHTML = html;
            renderSidebar();
        }

        function renderSidebar(dateStr) {
            const list = document.getElementById('eventList');
            const titleEl = document.getElementById('sidebarTitle');
            const subEl = document.getElementById('sidebarSubtitle');

            let filtered;
            if (dateStr) {
                filtered = events.filter(e => e.date === dateStr && (activeFilter === 'all' || e.cat === activeFilter || e.subtag === activeFilter));
                const d = new Date(dateStr + 'T12:00:00');
                titleEl.textContent = `${d.getDate()} de ${MONTHS[d.getMonth()]}`;
                subEl.textContent = filtered.length ? `${filtered.length} actividad(es)` : 'Sin actividades';
            } else {
                const monthStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}`;
                filtered = events.filter(e => e.date.startsWith(monthStr) && (activeFilter === 'all' || e.cat === activeFilter || e.subtag === activeFilter));
                filtered.sort((a,b) => a.date.localeCompare(b.date));
                titleEl.textContent = 'Próximas actividades';
                subEl.textContent = `${MONTHS[currentMonth]} ${currentYear}`;
            }

            if (!filtered.length) {
                list.innerHTML = '<div class="no-events">No hay actividades programadas</div>';
                return;
            }

            list.innerHTML = filtered.map(ev => {
                const d = new Date(ev.date + 'T12:00:00');
                return `
                    <div class="event-card event-card--${ev.color || ev.cat}">
                        <div class="event-card__date">${d.getDate()} ${MONTHS[d.getMonth()]}${ev.time ? ' · ' + ev.time + 'h' : ''}</div>
                        <div class="event-card__title">${ev.title}</div>
                        ${ev.subtitle ? `<div class="event-card__subtitle">${ev.subtitle}</div>` : ''}
                        <div class="event-card__desc">${ev.desc}</div>
                        ${ev.lugar ? `<div class="event-card__lugar">📍 ${ev.lugar}</div>` : ''}
                        ${ev.aportacion ? `<div class="event-card__aportacion">💰 Aportación: ${ev.aportacion}</div>` : ''}
                        <div style="display:flex;gap:0.4rem;flex-wrap:wrap;margin-top:0.5rem">
                            <span class="event-card__tag" style="margin-top:0">${CAT_LABELS[ev.cat]}</span>
                            ${ev.subtag ? `<span class="event-card__tag event-card__tag--subtag" style="margin-top:0;background:rgba(196,181,253,0.15);color:#c4b5fd;border:1px solid rgba(196,181,253,0.35)">${CAT_LABELS[ev.subtag] || ev.subtag}</span>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function changeMonth(dir) {
            currentMonth += dir;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar();
        }

        function goToday() {
            const today = new Date();
            currentMonth = today.getMonth();
            currentYear = today.getFullYear();
            renderCalendar();
        }

        function selectDate(dateStr) {
            renderSidebar(dateStr);
        }

        function filterCat(cat, el) {
            activeFilter = cat;
            document.querySelectorAll('.filter-tag, .filter-subtag').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            renderCalendar();
        }

        renderCalendar();
    </script>

</body>
</html>
